{% extends "ADMIN/base_admin.html" %}

{% block content %}
<div class="content-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0" style="font-size:1.5rem;">
            <i class="fas fa-truck-monster me-2 text-success"></i> RESCUE CENTERS
        </h2>
        <a href="/admin_home" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Return
        </a>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Center Name</th>
                    <th>District Base</th>
                    <th>Network Status</th>
                </tr>
            </thead>
            <tbody>
                {% for c in centers %}
                <tr>
                    <td class="fw-semibold text-main">{{ c.name }}</td>
                    <td>{{ c.district.name }}</td>
                    <td>
                        <span class="badge {% if c.status == 'active' %}bg-success{% else %}bg-secondary{% endif %}">
                            {{ c.status|upper }}
                        </span>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center py-5" style="color:var(--text-muted);">No rescue centers detected in the network.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
