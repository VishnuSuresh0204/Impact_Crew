{% extends "ADMIN/base_admin.html" %}

{% block content %}
<div class="content-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0" style="font-size:1.5rem;">
            <i class="fas fa-map me-2 text-cyan"></i> DISTRICTS
        </h2>
        <a href="/admin_home" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Return
        </a>
    </div>

    <div class="row mb-4">
        <div class="col-md-12">
            <form method="post" class="d-flex align-items-center gap-2">
                {% csrf_token %}
                <input type="text" name="name" class="form-control bg-dark text-light border-primary" placeholder="New District Name" required>
                <button type="submit" class="btn btn-primary" style="white-space:nowrap;"><i class="fas fa-plus me-1"></i> ADD</button>
            </form>
        </div>
    </div>

    <div class="row g-4 mt-2">
        {% for d in districts %}
        <div class="col-md-3 col-sm-6">
            <div class="dashboard-card text-center" style="padding:2rem 1rem; position:relative;">
                <div class="position-absolute top-0 end-0 p-2">
                    <a href="/admin_edit_district/{{ d.id }}/" class="text-info me-2" title="Edit"><i class="fas fa-edit"></i></a>
                    <a href="/admin_delete_district/{{ d.id }}/" class="text-danger" title="Delete" onclick="return confirm('Delete district?');"><i class="fas fa-trash"></i></a>
                </div>
                <i class="fas fa-map-location-dot mb-3" style="font-size:2.5rem; color:var(--neon-cyan); filter:drop-shadow(0 0 10px rgba(0,212,255,0.4));"></i>
                <h5 class="fw-bold mb-0 text-main" style="letter-spacing:1px; font-family:var(--font-head);">{{ d.name }}</h5>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <i class="fas fa-map-location-slash mb-3" style="font-size:3rem; color:var(--text-muted);"></i>
            <h5 class="text-muted">No districts configured in the system.</h5>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
