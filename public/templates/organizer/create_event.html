{% extends 'organizer/base_organizer.html' %}

{% block content %}
<div style="display: flex; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 600px;">
        <h2 style="margin-bottom: 1.5rem;">Create New Event</h2>
        <form method="POST">
            {% csrf_token %}
            <div>
                <label for="title">Event Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex: 1;">
                    <label for="max_volunteers">Max Volunteers Needed</label>
                    <input type="number" id="max_volunteers" name="max_volunteers" min="1" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div style="flex: 1;">
                    <label for="time">Time</label>
                    <input type="time" id="time" name="time" required>
                </div>
            </div>

            <div>
                <label for="location">Location</label>
                <input type="text" id="location" name="location" required>
            </div>
            
            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn" style="margin-top: 1rem;">Create Event</button>
        </form>
    </div>
</div>
{% endblock %}
