<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Organizer – ImpactCrew{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color:        transparent;
            --text-color:      #f8fafc;
            --nav-bg:          rgba(2, 6, 23, 0.85);
            --primary-color:   #0ea5e9;
            --primary-hover:   #0284c7;
            --secondary-color: rgba(255, 255, 255, 0.04);
            --accent-color:    #10b981;
            --border-color:    rgba(255, 255, 255, 0.08);
            --danger-color:    #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            background-image: url('/static/images/auth-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(2,6,23,0.9) 0%, rgba(8,47,73,0.88) 100%);
            z-index: -1;
        }

        nav {
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .btn {
            background: var(--primary-color);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background: var(--secondary-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.25s, background 0.25s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(14,165,233,0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .messages {
            list-style: none;
            margin-bottom: 1rem;
        }
        .messages li {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: var(--accent-color);
            color: #fff;
        }
        .messages li.error {
            background: var(--danger-color);
        }

        .stat-card .stat-num {
            background: linear-gradient(135deg, #0ea5e9, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .event-strip {
            border-left: 3px solid #0ea5e9;
            padding-left: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'organizer_dashboard' %}" class="logo">Org<span>Panel</span></a>
        <div class="nav-links">
            <a href="{% url 'organizer_dashboard' %}">📋 Dashboard</a>
            <a href="{% url 'create_event' %}">➕ Create Event</a>
            <a href="{% url 'organizer_profile' %}">👤 Profile</a>
            <a href="{% url 'submit_feedback' %}">💬 Feedback</a>
            <a href="{% url 'logout' %}" class="btn">Logout</a>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        
        {% block content %}
        {% endblock content %}
    </main>
</body>
</html>
