{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
        <form method="POST">
            {% csrf_token %}
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 1rem;">Login</button>
        </form>
        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
            Don't have an account?<br>
            <a href="{% url 'register_volunteer' %}" style="color: var(--primary-color);">Register as Volunteer</a> or 
            <a href="{% url 'register_organizer' %}" style="color: var(--primary-color);">Organizer</a>
        </p>
    </div>
</div>
{% endblock %}
