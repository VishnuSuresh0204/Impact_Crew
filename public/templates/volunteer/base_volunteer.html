<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Volunteer – ImpactCrew{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color:        transparent;
            --text-color:      #f8fafc;
            --nav-bg:          rgba(26, 11, 22, 0.9);
            --primary-color:   #f43f5e;
            --primary-hover:   #e11d48;
            --secondary-color: rgba(255, 255, 255, 0.05);
            --accent-color:    #f59e0b;
            --border-color:    rgba(255, 255, 255, 0.08);
            --danger-color:    #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            color: var(--text-color);
            line-height: 1.6;
            background-image: url('/static/images/auth-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(26,11,22,0.92) 0%, rgba(76,5,25,0.88) 100%);
            z-index: -1;
        }

        /* ── NAV ── */
        nav {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span { color: var(--primary-color); }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: var(--primary-color); }

        .btn {
            background: var(--primary-color);
            color: #fff;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: #fff;
        }

        /* ── LAYOUT ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background: var(--secondary-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.25s, background 0.25s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(244,63,94,0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .messages {
            list-style: none;
            margin-bottom: 1rem;
        }

        .messages li {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: var(--accent-color);
            color: #fff;
        }

        .messages li.error { background: var(--danger-color); }

        /* ── STAT CARDS ── */
        .stat-card .stat-num {
            background: linear-gradient(135deg, #f43f5e, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── EVENT CARD HOVER ── */
        .event-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(244, 63, 94, 0.25);
        }

        /* ── STATUS BADGE ── */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'volunteer_dashboard' %}" class="logo">Vol<span>Panel</span></a>
        <div class="nav-links">
            <a href="{% url 'volunteer_dashboard' %}">🏠 Dashboard</a>
            <a href="{% url 'volunteer_tasks' %}">📋 My Tasks</a>
            <a href="{% url 'volunteer_history' %}">🏅 History</a>
            <a href="{% url 'volunteer_profile' %}">👤 Profile</a>
            <a href="{% url 'submit_feedback' %}">💬 Feedback</a>
            <a href="{% url 'logout' %}" class="btn">Logout</a>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}
        {% endblock content %}
    </main>
</body>
</html>
